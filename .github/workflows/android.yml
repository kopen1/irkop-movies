name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Check signing secret
        id: check
        run: echo "signed=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        if: steps.check.outputs.signed == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          BODY=$(printf '%s' "$KS_B64" | tr -cd 'A-Za-z0-9+/')
          LEN=${#BODY}
          echo "Panjang base64 (tanpa padding): $LEN"
          PAD=$(( (4 - LEN % 4) % 4 ))
          if [ "$PAD" -ne 0 ]; then
            BODY="$BODY$(printf '%*s' "$PAD" '' | tr ' ' '=')"
          fi
          printf '%s' "$BODY" | base64 -d > android/app/nontongo.keystore 2>/dev/null || true
          SIZE=$(stat -c%s android/app/nontongo.keystore 2>/dev/null || echo 0)
          echo "Keystore bytes: $SIZE"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::Gagal decode keystore ($SIZE byte). Ambil nilai ANDROID_KEYSTORE_BASE64 dari ARTIFACT 'android-keystore' (file keystore.b64) hasil workflow 'Generate Android Keystore', bukan hasil copy dari log."
            exit 1
          fi

      - name: Verify keystore
        if: steps.check.outputs.signed == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore android/app/nontongo.keystore -storepass "$RELEASE_STORE_PASSWORD" > /dev/null \
            && echo "Keystore valid." \
            || { echo "::error::Keystore tidak bisa dibuka. Cek ANDROID_KEYSTORE_PASSWORD / isi base64."; exit 1; }

      - name: Build signed release APK
        if: steps.check.outputs.signed == 'true'
        working-directory: android
        env:
          RELEASE_STORE_FILE: nontongo.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (fallback)
        if: steps.check.outputs.signed != 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload release APK
        if: steps.check.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nontongo-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.check.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nontongo-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
