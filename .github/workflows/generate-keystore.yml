name: Generate Android Keystore

# Jalankan manual: Actions -> "Generate Android Keystore" -> Run workflow.
# Setelah selesai, buka log job ini dan copy nilai-nilainya ke:
#   Settings -> Secrets and variables -> Actions
# Lalu HAPUS run/artifact ini (dan bisa hapus file workflow ini) agar keystore tidak tersimpan.
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Password keystore & key (MINIMAL 6 karakter, catat baik-baik)"
        required: true
        default: "nontongo123"
      alias:
        description: "Alias key (minimal 1 huruf)"
        required: true
        default: "nontongo"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate input
        run: |
          PASS='${{ github.event.inputs.password }}'
          ALIAS='${{ github.event.inputs.alias }}'
          if [ "${#PASS}" -lt 6 ]; then
            echo "::error::Password harus minimal 6 karakter (sekarang ${#PASS}). Jalankan ulang dengan password lebih panjang."
            exit 1
          fi
          if [ -z "$ALIAS" ]; then
            echo "::error::Alias tidak boleh kosong."
            exit 1
          fi

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore nontongo.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=NontonGo, OU=App, O=NontonGo, L=Jakarta, S=DKI, C=ID"

      - name: Print values (copy ke GitHub Secrets)
        run: |
          echo ""
          echo "======================================================"
          echo " COPY NILAI BERIKUT KE GITHUB SECRETS"
          echo "======================================================"
          echo ""
          echo "ANDROID_KEY_ALIAS = ${{ github.event.inputs.alias }}"
          echo "ANDROID_KEYSTORE_PASSWORD = ${{ github.event.inputs.password }}"
          echo "ANDROID_KEY_PASSWORD = ${{ github.event.inputs.password }}"
          echo ""
          echo "ANDROID_KEYSTORE_BASE64 = (satu baris panjang di bawah ini):"
          echo ""
          echo "----BEGIN_BASE64----"
          base64 -w0 nontongo.keystore
          echo ""
          echo "----END_BASE64----"
          echo ""

      - name: Upload keystore (opsional)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: nontongo.keystore
          retention-days: 1
