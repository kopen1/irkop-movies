<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — NontonGo</title>
    <style>
      body { margin:0; background:#1b2333; color:#f2f6fd;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        display:grid; place-items:center; min-height:100vh; text-align:center; }
      .c { padding:24px; }
      h1 { font-size:1.4rem; margin:0 0 8px; }
      p { color:#adb8d0; margin:0 0 18px; }
      button { background:#e50914; color:#fff; border:0; border-radius:999px;
        padding:12px 24px; font-weight:700; font-size:.9rem; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="c">
      <h1>Tidak ada koneksi</h1>
      <p>Periksa jaringanmu lalu coba lagi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
