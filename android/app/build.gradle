plugins {
    id 'com.android.application'
}

// Signing: bila env RELEASE_STORE_FILE diisi (mis. dari GitHub Secrets), APK release
// ditandatangani dengan keystore tetap -> bisa update tanpa uninstall.
def releaseStore = System.getenv("RELEASE_STORE_FILE")
def vCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
def vName = System.getenv("VERSION_NAME") ?: "1.0"
def storePass = (System.getenv("RELEASE_STORE_PASSWORD") ?: "").trim()
def keyAliasVal = (System.getenv("RELEASE_KEY_ALIAS") ?: "").trim()
def keyPass = (System.getenv("RELEASE_KEY_PASSWORD") ?: "").trim()

android {
    namespace 'com.nontongo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nontongo.app"
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
        // Ganti BASE_URL bila domain berubah (harus diakhiri '/')
        buildConfigField "String", "BASE_URL", "\"https://irkop-movies.pages.dev/\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseStore != null) {
                storeFile file(releaseStore)
                storePassword storePass
                keyAlias keyAliasVal
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            if (releaseStore != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.6.2'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Images
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Player (HLS)
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
